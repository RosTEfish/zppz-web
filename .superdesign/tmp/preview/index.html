<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ZPPZ Arena — UI Redesign Preview</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700;800&family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <style>
    body { font-family: 'Outfit', 'Noto Sans SC', sans-serif; }
    .scan-grid {
      background-image:
        linear-gradient(rgba(255,45,122,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,229,255,0.03) 1px, transparent 1px);
      background-size: 48px 48px;
    }
    .glow-magenta { box-shadow: 0 0 32px rgba(255,45,122,0.2); }
    .glow-cyan { box-shadow: 0 0 24px rgba(0,229,255,0.15); }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
    .fade-up { animation: fadeUp 0.5s ease-out both; }
    @media (prefers-reduced-motion: reduce) { .fade-up { animation: none; } }
  </style>
</head>
<body class="bg-[#0A0E14] text-[#E8EDF5] min-h-screen scan-grid">
  <div class="min-h-screen flex flex-col items-center justify-center px-6 py-16">
    <div class="fade-up text-center max-w-2xl">
      <div class="inline-flex items-center gap-3 mb-6">
        <div class="w-12 h-12 rounded-xl bg-gradient-to-br from-[#FF2D7A] to-[#D91A63] flex items-center justify-center font-extrabold text-xl text-white glow-magenta">Z</div>
        <div class="text-left">
          <p class="font-extrabold text-xl tracking-tight">ZPPZ Arena</p>
          <p class="text-sm text-[#8B9BB5]">Neon Arena UI Redesign</p>
        </div>
      </div>
      <h1 class="text-3xl md:text-4xl font-extrabold mb-3">新 UI 示例稿预览</h1>
      <p class="text-[#8B9BB5] mb-10 leading-relaxed">深午夜底 + 霓虹品红强调 + 电青辅色。功能与信息架构与现站一致，仅视觉重设计。</p>
      <div class="grid sm:grid-cols-3 gap-4 w-full max-w-xl mx-auto">
        <a id="link-home" href="home.html" class="group block rounded-2xl border border-white/10 bg-[#151D2B]/80 backdrop-blur p-6 text-left hover:border-[#FF2D7A]/40 hover:-translate-y-1 transition-all duration-200 glow-magenta">
          <iconify-icon icon="lucide:home" width="28" class="text-[#FF2D7A] mb-3"></iconify-icon>
          <p class="font-bold text-lg">首页</p>
          <p class="text-sm text-[#8B9BB5] mt-1">Hero · 时间轴 · 阶段入口</p>
        </a>
        <a id="link-guess" href="guess.html" class="group block rounded-2xl border border-white/10 bg-[#151D2B]/80 backdrop-blur p-6 text-left hover:border-[#00E5FF]/40 hover:-translate-y-1 transition-all duration-200">
          <iconify-icon icon="lucide:vote" width="28" class="text-[#00E5FF] mb-3"></iconify-icon>
          <p class="font-bold text-lg">猜谱</p>
          <p class="text-sm text-[#8B9BB5] mt-1">筛选 · 卡片网格 · 投票</p>
        </a>
        <a id="link-login" href="login.html" class="group block rounded-2xl border border-white/10 bg-[#151D2B]/80 backdrop-blur p-6 text-left hover:border-[#FF2D7A]/40 hover:-translate-y-1 transition-all duration-200">
          <iconify-icon icon="lucide:key-round" width="28" class="text-[#FF2D7A] mb-3"></iconify-icon>
          <p class="font-bold text-lg">登录</p>
          <p class="text-sm text-[#8B9BB5] mt-1">登录 / 注册表单</p>
        </a>
      </div>
      <p class="text-xs text-[#5C6B82] mt-12">这谱谱这 · ZPPZ Arena · 视觉示例稿 v1</p>
    </div>
  </div>
</body>
</html>
