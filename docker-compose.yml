services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: zppz
      POSTGRES_USER: zppz
      POSTGRES_PASSWORD: zppz
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zppz -d zppz"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
    environment:
      DATABASE_URL: postgresql+psycopg://zppz:zppz@postgres:5432/zppz
      DATA_DIR: /data
      SECRET_KEY: ${SECRET_KEY:-zppz-local-dev-key-change-me}
      WEBHOOK_SIGNING_MASTER_KEY: ${WEBHOOK_SIGNING_MASTER_KEY:-zppz-local-dev-webhook-key-change-me}
      PUBLIC_BASE_URL: http://localhost:8080
      ADMIN_SEED_CODE: admin
      ADMIN_SEED_PASSWORD: ${ADMIN_SEED_PASSWORD:-zppz-local-admin}
      CORS_ORIGINS: http://localhost,http://127.0.0.1,http://localhost:3000,http://127.0.0.1:3000
      SECURE_COOKIES: "false"
      WEB_CONCURRENCY: "2"
      OBJECT_STORAGE_BACKEND: local
      DB_POOL_SIZE: "5"
      DB_MAX_OVERFLOW: "5"
      DB_POOL_TIMEOUT: "30"
      DB_POOL_RECYCLE: "1800"
    volumes:
      - zppz-data:/data
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
    command: ["python", "-m", "app.worker"]
    environment:
      DATABASE_URL: postgresql+psycopg://zppz:zppz@postgres:5432/zppz
      DATA_DIR: /data
      SECRET_KEY: ${SECRET_KEY:-zppz-local-dev-key-change-me}
      WEBHOOK_SIGNING_MASTER_KEY: ${WEBHOOK_SIGNING_MASTER_KEY:-zppz-local-dev-webhook-key-change-me}
      PUBLIC_BASE_URL: http://localhost:8080
      ADMIN_SEED_CODE: admin
      ADMIN_SEED_PASSWORD: ${ADMIN_SEED_PASSWORD:-zppz-local-admin}
      OBJECT_STORAGE_BACKEND: local
      DB_POOL_SIZE: "2"
      DB_MAX_OVERFLOW: "1"
      DB_POOL_TIMEOUT: "30"
      DB_POOL_RECYCLE: "1800"
    volumes:
      - zppz-data:/data
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  webhook-worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
    command: ["python", "-m", "app.webhook_worker"]
    environment:
      DATABASE_URL: postgresql+psycopg://zppz:zppz@postgres:5432/zppz
      DATA_DIR: /data
      SECRET_KEY: ${SECRET_KEY:-zppz-local-dev-key-change-me}
      WEBHOOK_SIGNING_MASTER_KEY: ${WEBHOOK_SIGNING_MASTER_KEY:-zppz-local-dev-webhook-key-change-me}
      PUBLIC_BASE_URL: http://localhost:8080
      OBJECT_STORAGE_BACKEND: local
      DB_POOL_SIZE: "2"
      DB_MAX_OVERFLOW: "1"
      DB_POOL_TIMEOUT: "30"
      DB_POOL_RECYCLE: "1800"
    volumes:
      - zppz-data:/data
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        NPM_CONFIG_REGISTRY: ${NPM_CONFIG_REGISTRY:-https://registry.npmjs.org}
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres-data:
  zppz-data:
