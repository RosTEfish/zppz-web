services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: zppz
      POSTGRES_USER: zppz
      POSTGRES_PASSWORD: zppz
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zppz -d zppz"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://zppz:zppz@postgres:5432/zppz
      DATA_DIR: /data
      SECRET_KEY: change-me-in-production
      ADMIN_SEED_CODE: admin
      ADMIN_SEED_PASSWORD: change-me-please
      CORS_ORIGINS: http://localhost,http://127.0.0.1,http://localhost:3000,http://127.0.0.1:3000
      SECURE_COOKIES: "false"
      WEB_CONCURRENCY: "2"
      DB_POOL_SIZE: "5"
      DB_MAX_OVERFLOW: "5"
      DB_POOL_TIMEOUT: "30"
      DB_POOL_RECYCLE: "1800"
    volumes:
      - zppz-data:/data
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres-data:
  zppz-data:
