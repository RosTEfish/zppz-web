<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <title>MajdataView · ZPPZ Preview</title>
    <style>
      :root { color-scheme: dark; font-family: Inter, "Noto Sans SC", system-ui, sans-serif; }
      * { box-sizing: border-box; }
      html, body, main { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #050807; }
      main { position: relative; display: grid; place-items: center; }
      canvas { width: 100%; height: 100%; display: block; background: #000; touch-action: none; }
      #status {
        position: absolute; inset: 0; display: grid; place-items: center; padding: 24px;
        color: #dff7e9; text-align: center; background:
          radial-gradient(circle at 50% 35%, rgba(62, 174, 111, .18), transparent 38%),
          #050807;
      }
      #status[hidden] { display: none; }
      .panel { width: min(360px, 88vw); }
      .mark { margin: 0 auto 18px; width: 42px; height: 42px; border: 2px solid #66cf94; border-radius: 50%; border-top-color: transparent; animation: spin .9s linear infinite; }
      .message { margin: 0 0 14px; font-weight: 650; }
      progress { width: 100%; height: 6px; accent-color: #66cf94; }
      .license { margin-top: 14px; color: #7f9588; font-size: 12px; line-height: 1.5; }
      .license a { color: #a6ddbd; }
      @keyframes spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { .mark { animation-duration: 2.4s; } }
    </style>
  </head>
  <body>
    <main>
      <canvas id="unity-canvas" aria-label="Majdata 谱面预览"></canvas>
      <div id="status" role="status" aria-live="polite">
        <div class="panel">
          <div class="mark" aria-hidden="true"></div>
          <p class="message" id="message">检查 WebGL2 支持</p>
          <progress id="progress" max="1" value="0"></progress>
          <p class="license">
            Powered by MajdataView · GPL-3.0<br />
            <a href="./LICENSE" target="_blank" rel="noreferrer">许可证</a>
            · <a href="./corresponding-source.zip" target="_blank" rel="noreferrer">对应源码</a>
          </p>
        </div>
      </div>
    </main>
    <script src="./Build.loader.js"></script>
    <script src="./player-bridge.js"></script>
  </body>
</html>
