[package]
name = "zppz-chart-validate"
version = "0.1.0"
edition = "2021"
description = "Sandboxed Majdata archive extract and safety validation for ZPPZ uploads"
license = "MIT"
publish = false

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
sevenz-rust2 = "0.19"

[dev-dependencies]
zip = { version = "2.2", default-features = false, features = ["deflate"] }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
