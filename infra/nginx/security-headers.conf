# Baseline headers for the site. Include this file from the server block and
# from every location that sets its own add_header (nginx drops inherited
# add_header directives in that case).
#
# The TLS-terminating host vhost must send the same headers. Browsers ignore
# HSTS on plain HTTP, and this image's nginx listens on port 80.
# Do not add Cross-Origin-Embedder-Policy or Cross-Origin-Opener-Policy:
# the chart preview loads a cross-origin WASM player and signed R2 media.

add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; script-src 'self' https://preview.przppz.club http://localhost:4173 http://127.0.0.1:4173 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob: https:; media-src 'self' blob: data: https:; connect-src 'self' https://preview.przppz.club http://localhost:4173 http://127.0.0.1:4173 https://*.r2.cloudflarestorage.com blob:; frame-src 'self' https://preview.przppz.club http://localhost:4173 http://127.0.0.1:4173; worker-src 'self' blob: https://preview.przppz.club http://localhost:4173 http://127.0.0.1:4173; manifest-src 'self'" always;
